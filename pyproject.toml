[project]
name = "horingsradar"
version = "0.1.0"
description = "Pilot: daglig sortering av høringer fra regjeringen.no etter personvernrelevans"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "selectolax",
    "pymupdf",
    "pydantic",
    "jinja2",
    "weasyprint",
    "rapidfuzz",
    "fastapi",
    "uvicorn",
]

[project.scripts]
horingsradar = "horingsradar.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horingsradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter wraps code; long SQL and prose strings are left intact.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
